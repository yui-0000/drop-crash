<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DROP CRASH</title>
    <style>
        body {
            margin: 0;
            background-color: #1e1e28;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
            box-sizing: border-box;
        }
        #gameContainer {
            text-align: center;
        }
        .title {
            color: #ff4757;
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .auth-card {
            background-color: #2b2b36;
            padding: 30px;
            border-radius: 12px;
            width: 340px;
            margin: 0 auto;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input {
            width: 90%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
        }
        .difficulty-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .diff-btn {
            flex: 1;
            margin: 0 4px;
            padding: 10px 0;
            border-radius: 6px;
            border: 2px solid transparent;
            background-color: #3d3d4e;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .diff-btn.active {
            border-color: #ffffff;
            transform: scale(1.05);
        }
        .diff-btn[data-diff="easy"].active { background-color: #2ed573; }
        .diff-btn[data-diff="normal"].active { background-color: #ffa502; }
        .diff-btn[data-diff="hard"].active { background-color: #ff4757; }

        .start-btn {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background-color: #ff4757;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .start-btn:hover {
            background-color: #ff6b81;
        }
        canvas {
            border: 2px solid #ffffff;
            background-color: #000000;
            display: none;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1 class="title">DROP CRASH</h1>

        <!-- ログイン＆難易度選択画面 -->
        <div id="authScreen" class="auth-card">
            <h2>プレイヤー登録 / ログイン</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="ユーザー名">
            </div>
            <div class="input-group">
                <input type="password" id="pincode" placeholder="4桁のピンコード" maxlength="4">
            </div>

            <!-- 難易度選択 -->
            <label style="display:block; margin-bottom: 8px; font-weight: bold;">難易度を選択:</label>
            <div class="difficulty-group">
                <button type="button" class="diff-btn" data-diff="easy">EASY</button>
                <button type="button" class="diff-btn active" data-diff="normal">NORMAL</button>
                <button type="button" class="diff-btn" data-diff="hard">HARD</button>
            </div>

            <button type="button" id="startBtn" class="start-btn">ゲームスタート</button>
        </div>

        <!-- ゲーム画面 -->
        <canvas id="gameCanvas" width="1000" height="700"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
